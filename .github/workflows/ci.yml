name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run workflow Code-node tests
        run: node --test tests/*.test.js
      - name: Validate Creator annotation artifacts
        run: node scripts/creators-annotations.mjs check
      - name: Parse every workflow JSON file
        run: node tests/validate-workflows.js
