name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run workflow Code-node tests
        run: node --test tests/*.test.js
      - name: Validate Creator annotation artifacts
        run: node scripts/creators-annotations.mjs check
      - name: Parse every workflow JSON file
        run: node tests/validate-workflows.js
